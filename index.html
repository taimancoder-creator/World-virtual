<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a111c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TAIMAN GTA Online</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="intro" class="loading">
 <div id="ld"><div id="ldt">Yuklanmoqda… 0%</div><div id="bar"><u id="barf"></u></div></div>
 <div id="pick">
  <h1>TAIMAN GTA</h1>
  <p>Personajingizni tanlang</p>
  <div id="grid"></div>
  <div class="row"><input id="nick" maxlength="16" placeholder="Ismingiz" autocomplete="off"><button id="go">Olamga kirish</button></div>
  <div id="msg"></div>
 </div>
</div>
<div id="rot"><div class="rbox"><div class="ph"></div><b>Telefonni yotqizing</b><p>O‘yin gorizontal (yotiq) holatda qulayroq: ekran kengroq bo‘ladi, tugmalar va joystik to‘sqinlik qilmaydi.</p><button id="rotOk">Tushunarli</button></div></div>
<div id="topbar">
 <div id="logo">TAIMAN GTA</div>
 <div id="topRight">
  <span id="chip" class="off"><i></i><span id="cn">1</span><span class="tx">onlayn</span></span>
  <button class="ib" id="fightBtn" aria-label="Jang va juftlik"><svg viewBox="0 0 24 24"><path d="M5 5l9 9M5 5v4M5 5h4"/><path d="M19 5l-9 9M19 5v4M19 5h-4"/><path d="M8 16l-3 3M16 16l3 3"/></svg></button>
  <button class="ib" id="shopBtn" aria-label="Shahar qurish"><svg viewBox="0 0 24 24"><path d="M6 8h12l1 12H5z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg></button>
  <button class="ib" id="mute" aria-label="Ovoz"><svg class="s1" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg><svg class="s2" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>
 </div>
</div>
<div id="radio">Ratsiya: o‘chiq</div>
<div id="log"></div><div id="hud"></div><div id="toast"></div>
<div id="term"><div id="tout"></div><div id="trow"><span>$</span><input id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send"></div></div>
<div id="bubbles"></div><div id="pops"></div>
<div id="hp"><u></u></div>
<button id="ctxBtn" class="ctx"></button>
<div id="joystick"><div id="stick"></div></div>
<div id="actions">
 <button class="action sm" id="chatBtn" aria-label="Xabar"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
 <button class="action sm" id="ptt" aria-label="Ratsiya"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
 <button class="action" id="punch" aria-label="Zarba"><svg viewBox="0 0 24 24"><path d="M12 3l2 5 5-2-2 5 5 2-5 2 2 5-5-2-2 5-2-5-5 2 2-5-5-2 5-2-2-5 5 2z"/></svg><span>ZARBA</span></button>
 <button class="action" id="jump" aria-label="Sakrash"><svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6M6 19l6-6 6 6"/></svg><span>SAKRA</span></button>
</div>
<button class="action" id="flipMain" aria-label="Salto"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg><span>SALTO</span></button>
<div id="flipPanel">
 <button class="action" id="flipBtn" aria-label="Front flip"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/></svg><span>FRONT</span></button>
 <button class="action" id="sideBtn" aria-label="Side flip"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 103-6.2"/><path d="M4 4v5h5"/></svg><span>SIDE</span></button>
 <button class="action" id="backBtn" aria-label="Back flip"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 103-6.2"/><path d="M4 4v5h5"/></svg><span>BACK</span></button>
 <button class="action" id="twFBtn" aria-label="Twist front flip"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/><path d="M12 8v8"/></svg><span>T-FRONT</span></button>
 <button class="action" id="twBBtn" aria-label="Twist back flip"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 103-6.2"/><path d="M4 4v5h5"/><path d="M12 8v8"/></svg><span>T-BACK</span></button>
</div>
<div id="chatPanel">
 <input id="messageInput" placeholder="Xabar yozing..." autocomplete="off" enterkeyhint="send" maxlength="140">
 <button id="send">YUBOR</button>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script async src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
